<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3555"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Route arc -->
  <path d="M 5 27 C 10 22, 22 10, 27 5"
        fill="none" stroke="#aac4e0" stroke-width="0.9"
        stroke-opacity="0.4" stroke-dasharray="2,2.2"/>

  <!-- City dots: Edinburgh · London · Paris · Swiss -->
  <circle cx="6.5"  cy="25.5" r="1.6" fill="#4a6fa5"/>
  <circle cx="12"   cy="20"   r="1.6" fill="#2e7d5e"/>
  <circle cx="20"   cy="12"   r="1.6" fill="#8b3a8b"/>
  <circle cx="25.5" cy="6.5"  r="1.6" fill="#c0392b"/>

  <!-- Airplane (top-down view, pointing upper-right via rotate -45°) -->
  <g transform="translate(16,16) rotate(-45)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="2" ry="9.5" fill="white"/>
    <!-- Main wings -->
    <polygon points="-2,-0.5 -10,4 -9.5,6 -2,3 2,3 9.5,6 10,4 2,-0.5" fill="white"/>
    <!-- Tail fins -->
    <polygon points="-2,8 -5.5,11.5 -5,13 -2,10 2,10 5,13 5.5,11.5 2,8" fill="white"/>
  </g>
</svg>
